name: Bug report
description: Report a reproducible problem in Clarity Studio.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md. Never attach API keys, private recordings, unsanitized logs, or personal file paths.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a synthetic recording and commands without credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, Python, browser, and Clarity version/commit; sanitized doctor output if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and attachments for keys, private paths and recording content.
          required: true
