name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install prebuilt dependencies
        run: |
          brew install --force-bottle ffmpeg-full
          uv sync --locked --python 3.12 --no-install-project --no-build
      - name: Check public source and reachable history
        run: .venv/bin/python scripts/check_public_repo.py
      - name: Check scripts
        run: |
          zsh -n setup.command clarity-cli 'Launch Clarity.command'
          node --check web/app.js
          node --check web/speech.js
          node --check web/preferences.js
      - name: Test Python and media behavior
        run: .venv/bin/python -m pytest -q
      - name: Test narration UI state
        run: node --test tests/speech-state.test.cjs
