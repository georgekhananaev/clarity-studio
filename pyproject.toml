[project]
name = "clarity-studio"
version = "0.1.0"
description = "Local screen recording captions, with a CLI for AI and a preview for people."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "George Khananaev"}]
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "keyring>=25,<27",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
